[project]
name = "pallanguzhi"
version = "0.1.0"
requires-python = "==3.15.0"
dependencies = [
    "numpy==2.5.4",
    "texttable==1.7.1",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"
